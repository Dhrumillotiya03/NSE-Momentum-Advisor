# LEGACY config. The strategy's single source of truth is
# scripts/strategy_config.py — regime exposure, name counts, the -18% stop,
# transaction cost, and the universe gate ALL live there and are shared by the
# backtest, live exit engine, paper trader, sim, and assistant.
#
# The three keys below are the ONLY ones still read anywhere, and only by the
# two hand-run legacy tools full_advisor.py and risk_manager.py. Editing any
# other value here has no effect — that is why the old dead keys were removed
# (rebalance_days, exposure_default, catastrophic_stop, trend_ma, backtest.*,
# data.*): they duplicated strategy_config.py and silently did nothing, a
# two-sources-of-truth trap.

capital: 1000000          # notional capital used by full_advisor/risk_manager sizing

portfolio:
  top_n: 10               # max position count (risk_manager.py)

risk:
  risk_per_trade: 0.01    # per-trade risk fraction (full_advisor.py, risk_manager.py)
